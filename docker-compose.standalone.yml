# Alternativa autocontenida: úsalo si el servidor NO tiene ya un Traefik/PaaS
# gestionando 80/443. Este stack trae su propio Caddy, que obtiene y renueva
# el certificado TLS automáticamente para SITE_DOMAIN vía Let's Encrypt.
#
# Uso: docker compose -f docker-compose.standalone.yml up -d --build
#
# Variables esperadas en .env:
#   SITE_DOMAIN=kaizogroup.com
#   PUBLIC_WEB3FORMS_ACCESS_KEY=...
#   PUBLIC_PLAUSIBLE_DOMAIN=...
#   PUBLIC_CLARITY_ID=...

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_WEB3FORMS_ACCESS_KEY: ${PUBLIC_WEB3FORMS_ACCESS_KEY:-}
        PUBLIC_PLAUSIBLE_DOMAIN: ${PUBLIC_PLAUSIBLE_DOMAIN:-}
        PUBLIC_CLARITY_ID: ${PUBLIC_CLARITY_ID:-}
    image: kaizogroup-web:latest
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
