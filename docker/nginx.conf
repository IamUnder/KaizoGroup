# www.kaizogroup.es llega aquí directo desde el túnel de Cloudflare (la regla de ingress
# apunta a este mismo contenedor, no hay Traefik por delante en este dominio) — sin este
# bloque, Google indexaba tanto el apex como el www como contenido real y duplicado en vez
# de ver un 301 al canónico (Search Console, 2026-09-21).
server {
    listen 80;
    server_name www.kaizogroup.es;
    return 301 https://kaizogroup.es$request_uri;
}

server {
    # default_server explícito a propósito: sin esto, al haber dos bloques server en este
    # fichero el PRIMERO gana por defecto para cualquier Host que no matchee exacto — se nos
    # coló así "www.kaizogroup.es" (arriba) capturando también kaizogroup.es, el canónico,
    # que debe seguir sirviendo contenido real, no redirigir a sí mismo.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cloudflared reenvía SIEMPRE por HTTP en texto plano dentro del túnel (TLS ya lo
    # terminó Cloudflare en su borde) — nginx no puede mirar $scheme para saber si el
    # visitante entró por http:// o https://, hace falta la cabecera que Cloudflare añade
    # con el esquema real. Sin esto, http://kaizogroup.es servía contenido real en vez de
    # redirigir (Search Console, 2026-09-21) porque "Always Use HTTPS" no está activado en
    # la zona y no tengo permiso de API para cambiarlo desde aquí.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
        application/xml image/svg+xml font/woff2 application/ld+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CSP: 'unsafe-inline' en script-src es deliberado, no un descuido — Astro incrusta los
    # <script> procesados de la página (formulario de contacto, analítica, animaciones) como
    # bloques inline en el HTML en vez de ficheros externos, así que restringir a hashes/nonce
    # obligaría a recalcularlos a mano en cada cambio de esos scripts, con el riesgo de que el
    # formulario de contacto se rompa en silencio si alguien lo olvida. El resto de directivas si
    # están en modo estricto (cero terceros no listados explícitamente, sin frames, sin plugins).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://*.clarity.ms; connect-src 'self' https://api.web3forms.com https://deploy.kaizogroup.es https://cloud.umami.is https://gateway.umami.is https://*.clarity.ms; img-src 'self' data: https://*.clarity.ms; style-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Assets con hash en el nombre (imágenes optimizadas, JS de islas) — cache larga.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.png {
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML — sin cache larga, para que los despliegues se vean al instante.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html $uri.html =404;
    }
}
